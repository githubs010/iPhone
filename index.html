<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Data Logger & Auto-Parser</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #555; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 90px; resize: vertical; }
        button { width: 100%; background-color: #007BFF; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .parse-btn { background-color: #28a745; margin-bottom: 15px; }
        .parse-btn:hover { background-color: #218838; }
        #status-message { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Device Data Logger</h2>
    
    <div class="form-group">
        <label for="rawTextInput">Paste Raw Device Data Here:</label>
        <textarea id="rawTextInput" placeholder="Paste raw text dump..."></textarea>
    </div>
    <button type="button" class="parse-btn" onclick="parseRawData()">Auto-Fill Form</button>

    <form id="deviceForm">
        <div class="form-group">
            <label for="modelNumber">Model no</label>
            <input type="text" id="modelNumber" required>
        </div>
        <div class="form-group">
            <label for="serialNumber">Serial Number</label>
            <input type="text" id="serialNumber" required>
        </div>
        <div class="form-group">
            <label for="colour">Colour</label>
            <input type="text" id="colour" required>
        </div>
        <div class="form-group">
            <label for="iphoneSeries">iPhone series</label>
            <input type="text" id="iphoneSeries" required>
        </div>
        <div class="form-group">
            <label for="imei1">Ime 1</label>
            <input type="text" id="imei1" required>
        </div>
        <div class="form-group">
            <label for="imei2">Ime 2</label>
            <input type="text" id="imei2">
        </div>
        <div class="form-group">
            <label for="deviceName">Divice name</label>
            <input type="text" id="deviceName" required>
        </div>
        <button type="submit" id="submitBtn">Save to Google Sheet</button>
    </form>
    <div id="status-message"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz5NImuD9H5lApJ9T2EXR7ZiCQXj421htZcco2jfoxuu67R3s-bFM4_Pp7k5By401GI/exec';

    const iphoneDB = {
        // iPhone 13 - (PRODUCT)RED
        "MLPJ3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLMQ3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLDX3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLNF3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLQ93": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLN03": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLE33": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLNL3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLQF3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLN53": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLEA3": { series: "iPhone 13", color: "(PRODUCT)RED" },
        "MLNR3": { series: "iPhone 13", color: "(PRODUCT)RED" },

        // iPhone 13 - Starlight
        "MLPG3": { series: "iPhone 13", color: "Starlight" },
        "MLMM3": { series: "iPhone 13", color: "Starlight" },
        "MLDV3": { series: "iPhone 13", color: "Starlight" },
        "MLND3": { series: "iPhone 13", color: "Starlight" },
        "3J818": { series: "iPhone 13", color: "Starlight" },
        "MLQ73": { series: "iPhone 13", color: "Starlight" },
        "MLMX3": { series: "iPhone 13", color: "Starlight" },
        "MLE13": { series: "iPhone 13", color: "Starlight" },
        "MLNJ3": { series: "iPhone 13", color: "Starlight" },
        "MLQD3": { series: "iPhone 13", color: "Starlight" },
        "MLN33": { series: "iPhone 13", color: "Starlight" },
        "MLE73": { series: "iPhone 13", color: "Starlight" },
        "MLNP3": { series: "iPhone 13", color: "Starlight" },

        // iPhone 13 - Midnight
        "MLA23": { series: "iPhone 13", color: "Midnight" },
        "MLPF3": { series: "iPhone 13", color: "Midnight" },
        "MLML3": { series: "iPhone 13", color: "Midnight" },
        "MLDU3": { series: "iPhone 13", color: "Midnight" },
        "MLNC3": { series: "iPhone 13", color: "Midnight" },
        "3J817": { series: "iPhone 13", color: "Midnight" },
        "3J827": { series: "iPhone 13", color: "Midnight" },
        "3M761": { series: "iPhone 13", color: "Midnight" },
        "MLQ63": { series: "iPhone 13", color: "Midnight" },
        "MLN23": { series: "iPhone 13", color: "Midnight" },
        "MLE03": { series: "iPhone 13", color: "Midnight" },
        "MLNH3": { series: "iPhone 13", color: "Midnight" },
        "MLQC3": { series: "iPhone 13", color: "Midnight" },
        "MLE63": { series: "iPhone 13", color: "Midnight" },
        "MLNN3": { series: "iPhone 13", color: "Midnight" },

        // iPhone 13 - Blue
        "MLPK3": { series: "iPhone 13", color: "Blue" },
        "MLMT3": { series: "iPhone 13", color: "Blue" },
        "MLDY3": { series: "iPhone 13", color: "Blue" },
        "MLNG3": { series: "iPhone 13", color: "Blue" },
        "3J821": { series: "iPhone 13", color: "Blue" },
        "MLQA3": { series: "iPhone 13", color: "Blue" },
        "MLN13": { series: "iPhone 13", color: "Blue" },
        "MLE43": { series: "iPhone 13", color: "Blue" },
        "MLNM3": { series: "iPhone 13", color: "Blue" },
        "MLQG3": { series: "iPhone 13", color: "Blue" },
        "MLN83": { series: "iPhone 13", color: "Blue" },
        "MLEC3": { series: "iPhone 13", color: "Blue" },
        "MLNT3": { series: "iPhone 13", color: "Blue" },

        // iPhone 13 - Pink
        "MLPH3": { series: "iPhone 13", color: "Pink" },
        "MLMN3": { series: "iPhone 13", color: "Pink" },
        "MLDW3": { series: "iPhone 13", color: "Pink" },
        "MLNE3": { series: "iPhone 13", color: "Pink" },
        "MLQ83": { series: "iPhone 13", color: "Pink" },
        "MLMY3": { series: "iPhone 13", color: "Pink" },
        "MLE23": { series: "iPhone 13", color: "Pink" },
        "MLNK3": { series: "iPhone 13", color: "Pink" },
        "MLQE3": { series: "iPhone 13", color: "Pink" },
        "MLN43": { series: "iPhone 13", color: "Pink" },
        "MLE93": { series: "iPhone 13", color: "Pink" },
        "MLNQ3": { series: "iPhone 13", color: "Pink" },

        // iPhone 13 - Green
        "MNGD3": { series: "iPhone 13", color: "Green" },
        "MNG93": { series: "iPhone 13", color: "Green" },
        "MNGK3": { series: "iPhone 13", color: "Green" },
        "MNGG3": { series: "iPhone 13", color: "Green" },
        "3K581": { series: "iPhone 13", color: "Green" },
        "MNGE3": { series: "iPhone 13", color: "Green" },
        "MNGA3": { series: "iPhone 13", color: "Green" },
        "MNGL3": { series: "iPhone 13", color: "Green" },
        "MNGH3": { series: "iPhone 13", color: "Green" },
        "MNGF3": { series: "iPhone 13", color: "Green" },
        "MNGC3": { series: "iPhone 13", color: "Green" },
        "MNGM3": { series: "iPhone 13", color: "Green" },
        "MNGJ3": { series: "iPhone 13", color: "Green" }
    };

    function parseRawData() {
        const text = document.getElementById('rawTextInput').value;

        function extractValue(key) {
            const regex = new RegExp(key + '\\s+(.+)');
            const match = text.match(regex);
            return match ? match[1].trim() : '';
        }

        const modelNo = extractValue('ModelNumber');
        const serialNo = extractValue('SerialNumber');
        const deviceName = extractValue('DeviceName');
        const imei1 = extractValue('InternationalMobileEquipmentIdentity');
        
        const imei2Match = text.match(/InternationalMobileEquipmentIdentity2\s+(.+)/);
        const imei2 = imei2Match ? imei2Match[1].trim() : '';

        let iphoneSeries = 'Unknown / Not in DB';
        let colour = 'Unknown / Not in DB';

        if (iphoneDB[modelNo]) {
            iphoneSeries = iphoneDB[modelNo].series;
            colour = iphoneDB[modelNo].color;
        }

        document.getElementById('modelNumber').value = modelNo;
        document.getElementById('serialNumber').value = serialNo;
        document.getElementById('colour').value = colour;
        document.getElementById('iphoneSeries').value = iphoneSeries;
        document.getElementById('imei1').value = imei1;
        document.getElementById('imei2').value = imei2;
        document.getElementById('deviceName').value = deviceName;
    }

    const form = document.getElementById('deviceForm');
    const statusMessage = document.getElementById('status-message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        statusMessage.style.color = '#007BFF';
        statusMessage.textContent = 'Saving data to sheet...';

        const formData = {
            modelNumber: document.getElementById('modelNumber').value,
            serialNumber: document.getElementById('serialNumber').value,
            colour: document.getElementById('colour').value,
            iphoneSeries: document.getElementById('iphoneSeries').value,
            imei1: document.getElementById('imei1').value,
            imei2: document.getElementById('imei2').value,
            deviceName: document.getElementById('deviceName').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            statusMessage.style.color = 'green';
            statusMessage.textContent = 'Successfully saved to Google Sheet!';
            form.reset();
            document.getElementById('rawTextInput').value = '';
            document.getElementById('submitBtn').disabled = false;
        })
        .catch(error => {
            statusMessage.style.color = 'red';
            statusMessage.textContent = 'Error saving data.';
            document.getElementById('submitBtn').disabled = false;
        });
    });
</script>

</body>
</html>
